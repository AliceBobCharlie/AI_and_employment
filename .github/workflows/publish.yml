name: Publish paper

# Renders paper_draft.qmd and deploys the result to GitHub Pages. The rendered
# site is uploaded as a Pages artifact, so it never lands on any branch.

# Every push to main rebuilds. There is no paths filter on purpose: a filter
# that misses one input (or gets mangled) shows up as a silent non-deployment,
# and the render takes under a minute.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits rather than cancelling a
# deployment that is already under way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.18

      - run: quarto render

      # Fail loudly rather than deploying a site with no landing page. Without
      # this, a paper_draft.qmd that lost its YAML header still renders -- to
      # paper_draft.html -- and the deployment succeeds while the site 404s.
      - name: Check the landing page exists
        run: test -s _site/index.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5