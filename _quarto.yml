project:
  type: default
  output-dir: _site
  # Render these only; without the list Quarto would also render README.MD
  # and every other Markdown file in the repository.
  render:
    - paper_draft.qmd
    - figures.qmd
  # Copied into the site as they are, so the pages can load them.
  resources:
    - figures.js
    - output/plot_data.csv

format:
  html:
    theme: theme.scss
    lang: en-GB
    toc: true
    toc-location: left
    toc-depth: 3
    toc-title: Contents
    anchor-sections: true
    link-external-icon: false
    grid:
      sidebar-width: 240px
      body-width: 800px
      margin-width: 120px
      gutter-width: 2rem
    include-in-header:
      text: |
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
    include-after-body:
      text: |
        <script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@4.1.1/plotly.min.js"
                integrity="sha384-AFNp2MtSm5/oZbEs/J19F/Ah57MEiVsoed8nE3fq2Wnccdl1u/EkyJ9XKKU8rt7+"
                crossorigin="anonymous"></script>
        <script src="figures.js"></script>
